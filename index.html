<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="资源分享站 - 学习资源分享与下载">
<title>资源分享站</title>

<!-- 主题预加载：防止首屏闪烁 -->
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; } catch (e) {}
</script>

<style>
  /* ========== 设计令牌 ========== */
  :root {
    --primary: #58a6ff;
    --primary-2: #bc8cff;
    --bg: #0d1117;
    --bg-elev: #161b22;
    --bg-elev-2: #1c2128;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --border: #30363d;
    --shadow: rgba(1, 4, 9, .6);
    --glow-1: rgba(88, 166, 255, .16);
    --glow-2: rgba(188, 140, 255, .14);
    --code-bg: #0b0f14;
    --radius: 12px;
  }

  html[data-theme='light'] {
    --primary: #0969da;
    --primary-2: #8250df;
    --bg: #f6f8fa;
    --bg-elev: #ffffff;
    --bg-elev-2: #eef2f6;
    --text: #1f2328;
    --text-dim: #656d76;
    --border: #d8dee4;
    --shadow: rgba(31, 35, 40, .16);
    --glow-1: rgba(9, 105, 218, .10);
    --glow-2: rgba(130, 80, 223, .10);
    --code-bg: #eef2f6;
  }

  /* ========== 基础 ========== */
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
    background-color: var(--bg); color: var(--text); line-height: 1.65;
    min-height: 100vh; -webkit-font-smoothing: antialiased;
    transition: background-color .35s ease, color .35s ease;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(620px circle at 12% -5%, var(--glow-1), transparent 62%),
                radial-gradient(620px circle at 88% 5%, var(--glow-2), transparent 62%);
    pointer-events: none; z-index: 0;
  }
  [v-cloak] { display: none; }

  /* ========== 进度条 ========== */
  .progress {
    position: fixed; top: 0; left: 0; height: 3px; width: 100%;
    transform-origin: 0 50%;
    background: linear-gradient(90deg, var(--primary), var(--primary-2));
    z-index: 100; transition: transform .1s linear; border-radius: 0 3px 3px 0;
  }

  /* ========== 布局 ========== */
  .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 0 20px 20px; }
  .site-header {
    position: sticky; top: 0; z-index: 50; margin: 0 -20px; padding: 12px 20px;
    display: flex; align-items: center; gap: 16px;
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid transparent; transition: border-color .3s, background .3s;
  }
  .site-header.scrolled { border-bottom-color: var(--border); }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 1.05rem; color: var(--text); text-decoration: none; letter-spacing: .3px; white-space: nowrap; }
  .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-2)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 18%, transparent); animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 18%, transparent); } 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--primary) 6%, transparent); } }
  .header-nav { display: flex; gap: 4px; margin-left: auto; }
  .header-nav a { color: var(--text-dim); text-decoration: none; font-size: .9rem; padding: 6px 12px; border-radius: 8px; transition: color .2s, background .2s; }
  .header-nav a:hover { color: var(--text); background: var(--bg-elev-2); }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-dim); cursor: pointer; transition: color .2s, border-color .2s, transform .2s, background .2s; flex-shrink: 0; }
  .icon-btn:hover { color: var(--primary); border-color: var(--primary); transform: translateY(-1px); }
  .icon-btn:active { transform: scale(.94); }

  /* ========== Hero ========== */
  .hero { padding: 44px 0 8px; }
  .hero h1 { font-size: clamp(1.6rem, 5vw, 2.3rem); line-height: 1.3; margin: 0 0 12px; letter-spacing: -.5px; font-weight: 800; }
  .grad-text { background: linear-gradient(120deg, var(--primary), var(--primary-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .subtitle { margin: 0 0 26px; color: var(--text-dim); font-size: .98rem; }
  .typing-effect { border-left: 3px solid var(--primary); padding: 4px 0 4px 1rem; margin: 0 0 32px; white-space: pre-wrap; text-align: left; font-size: .92rem; color: var(--text-dim); min-height: 3.6em; border-radius: 2px; }
  .caret { display: inline-block; width: 2px; height: 1.05em; background: var(--primary); vertical-align: text-bottom; margin-left: 2px; animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }

  /* ========== 工具栏 ========== */
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 0 0 20px; }
  .search-wrap { position: relative; flex: 1 1 240px; display: flex; align-items: center; }
  .search-wrap .search-icon { position: absolute; left: 13px; color: var(--text-dim); pointer-events: none; display: flex; }
  .search-wrap input { width: 100%; padding: 11px 78px 11px 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-elev); color: var(--text); font-size: .92rem; font-family: inherit; outline: none; transition: border-color .2s, box-shadow .2s; }
  .search-wrap input::placeholder { color: var(--text-dim); }
  .search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent); }
  .search-wrap kbd { position: absolute; right: 12px; font-size: .7rem; font-family: inherit; color: var(--text-dim); background: var(--bg-elev-2); border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; pointer-events: none; }
  .clear-btn { position: absolute; right: 8px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 6px; background: var(--bg-elev-2); color: var(--text-dim); font-size: 1rem; line-height: 1; cursor: pointer; transition: color .2s, background .2s; }
  .clear-btn:hover { color: var(--text); background: var(--border); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { display: inline-flex; align-items: center; gap: 6px; padding: 9px 15px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-dim); font-size: .88rem; font-family: inherit; cursor: pointer; white-space: nowrap; transition: all .22s ease; }
  .tab:hover { color: var(--text); border-color: var(--text-dim); }
  .tab.active { color: #fff; background: linear-gradient(135deg, var(--primary), var(--primary-2)); border-color: transparent; box-shadow: 0 4px 16px -6px var(--primary); }
  .tab .count { font-size: .72rem; opacity: .75; background: color-mix(in srgb, currentColor 16%, transparent); padding: 0 6px; border-radius: 20px; min-width: 18px; text-align: center; }

  /* ========== 卡片 ========== */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .card { position: relative; display: flex; align-items: center; gap: 12px; padding: 14px 15px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); text-decoration: none; color: inherit; overflow: hidden; transition: transform .28s cubic-bezier(.2,.8,.2,1), border-color .28s ease, box-shadow .28s ease, background .28s ease; animation: cardIn .4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
  .card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: 0 14px 32px -14px var(--shadow), 0 0 0 1px color-mix(in srgb, var(--primary) 28%, transparent); }
  .card-icon { flex-shrink: 0; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; border-radius: 11px; background: var(--bg-elev-2); border: 1px solid var(--border); transition: transform .28s ease, background .28s ease; }
  .card:hover .card-icon { transform: scale(1.08) rotate(-4deg); background: color-mix(in srgb, var(--primary) 14%, var(--bg-elev-2)); }
  .card-body { min-width: 0; flex: 1; }
  .card-title { display: flex; align-items: center; gap: 6px; font-size: .95rem; font-weight: 600; margin: 0 0 2px; line-height: 1.35; }
  .card-desc { margin: 0; font-size: .8rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .copy-btn { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 7px; color: var(--text-dim); background: var(--bg-elev-2); border: 1px solid var(--border); opacity: 0; transform: translateY(-4px); cursor: pointer; transition: opacity .22s, transform .22s, color .22s, border-color .22s; }
  .card:hover .copy-btn { opacity: 1; transform: translateY(0); }
  .copy-btn:hover { color: var(--primary); border-color: var(--primary); }

  /* ========== 其他 ========== */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); border: 1px dashed var(--border); border-radius: var(--radius); margin-bottom: 8px; }
  .section-title { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 700; margin: 44px 0 16px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }
  .video-container { position: relative; padding-bottom: 56.25%; height: 0; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: #000; box-shadow: 0 18px 40px -22px var(--shadow); }
  .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  footer { margin-top: 56px; padding: 24px 0 8px; border-top: 1px solid var(--border); color: var(--text-dim); font-size: .84rem; text-align: center; }
  .to-top { position: fixed; right: 22px; bottom: 22px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-elev); color: var(--text); cursor: pointer; z-index: 60; transition: opacity .3s, transform .3s; }
  .to-top.hide { opacity: 0; transform: translateY(14px); pointer-events: none; }
  .toast-wrap { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); z-index: 200; pointer-events: none; }
  .toast { padding: 10px 18px; border-radius: 10px; background: var(--bg-elev); border: 1px solid var(--primary); color: var(--text); font-size: .88rem; box-shadow: 0 14px 34px -14px var(--shadow); }
</style>
</head>

<body>
<div id="app" v-cloak>
  <div class="progress" :style="{ transform: `scaleX(${progress / 100})` }"></div>

  <div class="container">
    <!-- 顶栏 -->
    <header class="site-header" :class="{ scrolled: scrolled }">
      <a href="#" class="logo" @click.prevent="toTop">
        <span class="logo-dot"></span> 资源分享站
      </a>
      <nav class="header-nav">
        <a href="#resources">资源</a>
        <a href="#video">视频</a>
      </nav>
      <button class="icon-btn" @click="toggleTheme" :title="theme === 'dark' ? '浅色' : '深色'">
        <svg v-if="theme === 'dark'" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
        <svg v-else width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <!-- Hero -->
    <section class="hero">
      <h1>欢迎来到 <span class="grad-text">资源分享站</span></h1>
      <p class="subtitle">学习资源 · 高效分享 · 安全下载</p>
      <div class="typing-effect">
        <span>{{ typed }}</span><span class="caret"></span>
      </div>
    </section>

    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="search-wrap">
        <input v-model="keyword" type="search" placeholder="搜索资源名称或描述…">
        <button v-if="keyword" class="clear-btn" @click="keyword = ''">×</button>
      </div>
      <div class="tabs">
        <button v-for="c in cats" :key="c.key" class="tab" :class="{ active: cat === c.key }" @click="cat = c.key">
          {{ c.label }} <span class="count">{{ countOf(c.key) }}</span>
        </button>
      </div>
    </div>

    <!-- 资源网格 -->
    <section id="resources">
      <div class="grid" v-if="filtered.length">
        <a v-for="(r, i) in filtered" :key="r.id" class="card" :href="r.url" target="_blank">
          <div class="card-icon">{{ r.icon }}</div>
          <div class="card-body">
            <h3 class="card-title">{{ r.title }}</h3>
            <p class="card-desc">{{ r.desc }}</p>
          </div>
          <span class="copy-btn" @click.prevent.stop="copy(r.url)">复制</span>
        </a>
      </div>
      <div class="empty" v-else>
        <span>没有找到相关资源</span>
      </div>
    </section>

    <!-- 视频区 -->
    <section id="video">
      <h2 class="section-title">推荐视频</h2>
      <div class="video-container">
        <!-- 替换为你自己的 B站或 YouTube iframe 链接 -->
        <iframe src="//player.bilibili.com/player.html?bvid=BV1GJ411x7h7&page=1" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>
      </div>
    </section>

    <!-- 页脚 -->
    <footer>
      <p>© 2026 资源分享站. All rights reserved.</p>
    </footer>
  </div>

  <!-- 返回顶部 -->
  <button class="to-top" :class="{ hide: progress < 10 }" @click="toTop">↑</button>
</div>

<!-- 引入 Vue 3 (使用国内可访问的 CDN) -->
<script src="https://cdn.staticfile.org/vue/3.3.4/vue.global.prod.js"></script>
<script>
  const { createApp } = Vue;

  createApp({
    data() {
      return {
        theme: 'dark',
        scrolled: false,
        progress: 0,
        keyword: '',
        cat: 'all',
        typed: '这里是你的专属学习资源库...',
        cats: [
          { key: 'all', label: '全部' },
          { key: 'code', label: '编程开发' },
          { key: 'design', label: '设计素材' }
        ],
        resources: [
          { id: 1, cat: 'code', icon: '💻', title: 'GitHub', desc: '全球最大的代码托管平台', url: 'https://github.com' },
          { id: 2, cat: 'design', icon: '🎨', title: 'Figma', desc: '在线协作设计工具', url: 'https://figma.com' },
          { id: 3, cat: 'code', icon: '📚', title: 'MDN Web Docs', desc: 'Web 开发权威文档', url: 'https://developer.mozilla.org' }
        ]
      }
    },
    computed: {
      filtered() {
        return this.resources.filter(r => {
          const matchCat = this.cat === 'all' || r.cat === this.cat;
          const matchKw = r.title.toLowerCase().includes(this.keyword.toLowerCase()) || 
                          r.desc.toLowerCase().includes(this.keyword.toLowerCase());
          return matchCat && matchKw;
        });
      }
    },
    mounted() {
      this.theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.dataset.theme = this.theme;
      
      window.addEventListener('scroll', this.handleScroll);
    },
    methods: {
      toggleTheme() {
        this.theme = this.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = this.theme;
        localStorage.setItem('theme', this.theme);
      },
      handleScroll() {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        this.progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        this.scrolled = scrollTop > 10;
      },
      toTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },
      countOf(key) {
        return key === 'all' ? this.resources.length : this.resources.filter(r => r.cat === key).length;
      },
      copy(text) {
        navigator.clipboard.writeText(text).then(() => {
          alert('链接已复制：' + text);
        });
      }
    }
  }).mount('#app');
</script>
</body>
</html>
