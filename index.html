<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="资源分享站 - 学习资源分享与下载">
<title>资源分享站</title>

<!-- 主题预加载：防止首屏闪烁 -->
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; } catch (e) {}
</script>
<!-- 直接引入本地文件 -->
<script src="./vue.global.prod.js"></script>
<style>
  /* ========== 设计令牌 ========== */
  :root {
    --primary: #58a6ff; --primary-2: #bc8cff; --bg: #0d1117; --bg-elev: #161b22;
    --bg-elev-2: #1c2128; --text: #c9d1d9; --text-dim: #8b949e; --border: #30363d;
    --shadow: rgba(1, 4, 9, .6); --glow-1: rgba(88, 166, 255, .16); --glow-2: rgba(188, 140, 255, .14);
    --radius: 12px;
  }
  html[data-theme='light'] {
    --primary: #0969da; --primary-2: #8250df; --bg: #f6f8fa; --bg-elev: #ffffff;
    --bg-elev-2: #eef2f6; --text: #1f2328; --text-dim: #656d76; --border: #d8dee4;
    --shadow: rgba(31, 35, 40, .16); --glow-1: rgba(9, 105, 218, .10); --glow-2: rgba(130, 80, 223, .10);
  }

  /* ========== 基础 ========== */
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
    background-color: var(--bg); color: var(--text); line-height: 1.65; min-height: 100vh;
    -webkit-font-smoothing: antialiased; transition: background-color .35s ease, color .35s ease;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(620px circle at 12% -5%, var(--glow-1), transparent 62%),
                radial-gradient(620px circle at 88% 5%, var(--glow-2), transparent 62%);
    pointer-events: none; z-index: 0;
  }

  /* ⚠️ 这里去掉了 [v-cloak] { display: none; } 防止 CDN 挂掉时白屏 */

  /* ========== 进度条 ========== */
  .progress {
    position: fixed; top: 0; left: 0; height: 3px; width: 100%;
    transform-origin: 0 50%; background: linear-gradient(90deg, var(--primary), var(--primary-2));
    z-index: 100; transition: transform .1s linear;
  }

  /* ========== 布局 ========== */
  .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 0 20px 20px; }
  .site-header {
    position: sticky; top: 0; z-index: 50; margin: 0 -20px; padding: 12px 20px;
    display: flex; align-items: center; gap: 16px;
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: blur(14px); border-bottom: 1px solid transparent; transition: border-color .3s;
  }
  .site-header.scrolled { border-bottom-color: var(--border); }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 700; color: var(--text); text-decoration: none; }
  .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-2)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 18%, transparent); }
  .header-nav { display: flex; gap: 4px; margin-left: auto; }
  .header-nav a { color: var(--text-dim); text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: .9rem; }
  .header-nav a:hover { color: var(--text); background: var(--bg-elev-2); }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-dim); cursor: pointer; transition: all .2s; }
  .icon-btn:hover { color: var(--primary); border-color: var(--primary); }

  /* ========== Hero ========== */
  .hero { padding: 44px 0 8px; }
  .hero h1 { font-size: clamp(1.6rem, 5vw, 2.3rem); margin: 0 0 12px; font-weight: 800; }
  .grad-text { background: linear-gradient(120deg, var(--primary), var(--primary-2)); -webkit-background-clip: text; color: transparent; }
  .subtitle { margin: 0 0 26px; color: var(--text-dim); }
  .typing-effect { border-left: 3px solid var(--primary); padding: 4px 0 4px 1rem; margin: 0 0 32px; color: var(--text-dim); min-height: 3.6em; }
  .caret { display: inline-block; width: 2px; height: 1.05em; background: var(--primary); vertical-align: text-bottom; margin-left: 2px; animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }

  /* ========== 工具栏 ========== */
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 0 0 20px; }
  .search-wrap { position: relative; flex: 1 1 240px; }
  .search-wrap input { width: 100%; padding: 11px 40px 11px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-elev); color: var(--text); outline: none; transition: all .2s; }
  .search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; }
  .tab { padding: 9px 15px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-dim); cursor: pointer; transition: all .2s; white-space: nowrap; }
  .tab.active { color: #fff; background: linear-gradient(135deg, var(--primary), var(--primary-2)); border-color: transparent; }
  .tab .count { font-size: .72rem; background: rgba(255,255,255,.2); padding: 2px 6px; border-radius: 10px; margin-left: 4px; }

  /* ========== 卡片 ========== */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 12px; }
  .card { display: flex; align-items: center; gap: 12px; padding: 14px 15px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); text-decoration: none; color: inherit; transition: all .28s; }
  .card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: 0 10px 20px -10px var(--shadow); }
  .card-icon { flex-shrink: 0; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; border-radius: 11px; background: var(--bg-elev-2); border: 1px solid var(--border); }
  .card-title { font-size: .95rem; font-weight: 600; margin: 0 0 2px; }
  .card-desc { margin: 0; font-size: .8rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ========== 其他 ========== */
  .empty { text-align: center; padding: 60px; color: var(--text-dim); border: 1px dashed var(--border); border-radius: var(--radius); }
  .to-top { position: fixed; right: 22px; bottom: 22px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-elev); color: var(--text); cursor: pointer; transition: opacity .3s; }
  .to-top.hide { opacity: 0; pointer-events: none; }
</style>
</head>

<body>
<!-- 注意：去掉了 v-cloak，即使 Vue 没加载，你也至少能看到一句“加载中” -->
<div id="app">
  
  <!-- 用 v-if="isLoaded" 控制：Vue 加载成功后才显示内容 -->
  <template v-if="isLoaded">
    <div class="progress" :style="{ transform: `scaleX(${progress / 100})` }"></div>

    <div class="container">
      <header class="site-header" :class="{ scrolled: scrolled }">
        <a href="#" class="logo" @click.prevent="toTop">
          <span class="logo-dot"></span> 资源分享站
        </a>
        <nav class="header-nav">
          <a href="#resources">资源</a>
        </nav>
        <button class="icon-btn" @click="toggleTheme" :title="theme === 'dark' ? '浅色' : '深色'">
          <svg v-if="theme === 'dark'" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
          <svg v-else width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </header>

      <section class="hero">
        <h1>欢迎来到 <span class="grad-text">资源分享站</span></h1>
        <p class="subtitle">学习资源 · 高效分享 · 安全下载</p>
        <div class="typing-effect">
          <span>{{ typedText }}</span><span class="caret"></span>
        </div>
      </section>

      <div class="toolbar">
        <div class="search-wrap">
          <input v-model="keyword" type="search" placeholder="搜索资源名称或描述…">
        </div>
        <div class="tabs">
          <button v-for="c in cats" :key="c.key" class="tab" :class="{ active: cat === c.key }" @click="cat = c.key">
            {{ c.label }} <span class="count">{{ countOf(c.key) }}</span>
          </button>
        </div>
      </div>

      <section id="resources">
        <div class="grid" v-if="filtered.length">
          <a v-for="r in filtered" :key="r.id" class="card" :href="r.url" target="_blank">
            <div class="card-icon">{{ r.icon }}</div>
            <div>
              <h3 class="card-title">{{ r.title }}</h3>
              <p class="card-desc">{{ r.desc }}</p>
            </div>
          </a>
        </div>
        <div class="empty" v-else>没有找到相关资源</div>
      </section>
    </div>

    <button class="to-top" :class="{ hide: progress < 10 }" @click="toTop">↑</button>
  </template>

  <!-- 兜底提示：Vue 加载成功后这里会被隐藏 -->
  <div v-else style="text-align: center; padding: 100px 20px; color: #666;">
    <h2>正在加载 Vue 组件...</h2>
    <p>如果长时间停留在该页面，说明 CDN 被网络屏蔽，请按 F12 查看控制台报错。</p>
  </div>

</div>

<!-- 引入 Vue 3：优先使用字节跳动 CDN，若失败则使用 BootCDN -->
<script src="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/vue/3.2.31/vue.global.prod.min.js"></script>
<script>
  // 检查 Vue 是否加载成功，如果失败则换备用源
  if (typeof Vue === 'undefined') {
    document.write('<script src="https://cdn.bootcdn.net/ajax/libs/vue/3.2.31/vue.global.prod.min.js"><\/script>');
  }
</script>
<script>
  window.onload = function() {
    // 如果两个 CDN 都加载失败，控制台会报错，页面上会出现兜底文字
    if (typeof Vue === 'undefined') {
      console.error('Vue 3 未能加载！请检查服务器网络或更换 CDN。');
      return;
    }

    const { createApp } = Vue;

    createApp({
      data() {
        return {
          isLoaded: true, // 加载成功标识
          theme: 'dark',
          scrolled: false,
          progress: 0,
          keyword: '',
          cat: 'all',
          typedText: '这里是你的专属学习资源库...',
          cats: [
            { key: 'all', label: '全部' },
            { key: 'code', label: '编程开发' },
            { key: 'design', label: '设计素材' }
          ],
          resources: [
            { id: 1, cat: 'code', icon: '💻', title: 'GitHub', desc: '全球最大的代码托管平台', url: 'https://github.com' },
            { id: 2, cat: 'design', icon: '🎨', title: 'Figma', desc: '在线协作设计工具', url: 'https://figma.com' },
            { id: 3, cat: 'code', icon: '📚', title: 'MDN Web Docs', desc: 'Web 开发权威文档', url: 'https://developer.mozilla.org' },
            { id: 4, cat: 'code', icon: '⬇️', title: '下载', desc: '测试网络带宽', url: '/app/1.apk' },
          ]
        }
      },
      computed: {
        filtered() {
          return this.resources.filter(r => {
            const matchCat = this.cat === 'all' || r.cat === this.cat;
            const matchKw = r.title.toLowerCase().includes(this.keyword.toLowerCase()) || 
                            r.desc.toLowerCase().includes(this.keyword.toLowerCase());
            return matchCat && matchKw;
          });
        }
      },
      mounted() {
        this.theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.dataset.theme = this.theme;
        window.addEventListener('scroll', this.handleScroll);
      },
      methods: {
        toggleTheme() {
          this.theme = this.theme === 'dark' ? 'light' : 'dark';
          document.documentElement.dataset.theme = this.theme;
          localStorage.setItem('theme', this.theme);
        },
        handleScroll() {
          const scrollTop = window.scrollY;
          const docHeight = document.documentElement.scrollHeight - window.innerHeight;
          this.progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
          this.scrolled = scrollTop > 10;
        },
        toTop() {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },
        countOf(key) {
          return key === 'all' ? this.resources.length : this.resources.filter(r => r.cat === key).length;
        }
      }
    }).mount('#app');
  }
</script>
</body>
</html>
