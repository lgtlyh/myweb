<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="资源分享站 - 学习资源分享与下载">
<link rel="icon" href="http://gips0.baidu.com/it/u=1640072233,1230501354&fm=3042&app=3042&f=JPEG&wm=1,huayi,0,0,13,9&wmo=0,0&w=512&h=512" type="image/x-icon">
<title>资源分享站</title>

<!-- 主题预加载：防止首屏闪烁 -->
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; } catch (e) {}
</script>

<style>
  /* ========== 设计令牌 ========== */
  :root {
    --primary: #58a6ff;
    --primary-2: #bc8cff;
    --bg: #0d1117;
    --bg-elev: #161b22;
    --bg-elev-2: #1c2128;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --border: #30363d;
    --shadow: rgba(1, 4, 9, .6);
    --glow-1: rgba(88, 166, 255, .16);
    --glow-2: rgba(188, 140, 255, .14);
    --code-bg: #0b0f14;
    --radius: 12px;
  }

  html[data-theme='light'] {
    --primary: #0969da;
    --primary-2: #8250df;
    --bg: #f6f8fa;
    --bg-elev: #ffffff;
    --bg-elev-2: #eef2f6;
    --text: #1f2328;
    --text-dim: #656d76;
    --border: #d8dee4;
    --shadow: rgba(31, 35, 40, .16);
    --glow-1: rgba(9, 105, 218, .10);
    --glow-2: rgba(130, 80, 223, .10);
    --code-bg: #eef2f6;
  }

  /* ========== 基础 ========== */
  *, *::before, *::after { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.65;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background-color .35s ease, color .35s ease;
  }

  /* 背景光晕 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(620px circle at 12% -5%, var(--glow-1), transparent 62%),
      radial-gradient(620px circle at 88% 5%, var(--glow-2), transparent 62%);
    pointer-events: none;
    z-index: 0;
  }

  [v-cloak] { display: none; }

  /* ========== 滚动进度条 ========== */
  .progress {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    width: 100%;
    transform-origin: 0 50%;
    background: linear-gradient(90deg, var(--primary), var(--primary-2));
    z-index: 100;
    transition: transform .1s linear;
    border-radius: 0 3px 3px 0;
  }

  /* ========== 布局容器 ========== */
  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 20px;
  }

  /* ========== 顶栏 ========== */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 50;
    margin: 0 -20px;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid transparent;
    transition: border-color .3s, background .3s;
  }
  .site-header.scrolled { border-bottom-color: var(--border); }

  .logo {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--text);
    text-decoration: none;
    letter-spacing: .3px;
    white-space: nowrap;
  }
  .logo-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 18%, transparent);
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 18%, transparent); }
    50%      { box-shadow: 0 0 0 8px color-mix(in srgb, var(--primary) 6%, transparent); }
  }

  .header-nav {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }
  .header-nav a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: .9rem;
    padding: 6px 12px;
    border-radius: 8px;
    transition: color .2s, background .2s;
  }
  .header-nav a:hover { color: var(--text); background: var(--bg-elev-2); }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-elev);
    color: var(--text-dim);
    cursor: pointer;
    transition: color .2s, border-color .2s, transform .2s, background .2s;
    flex-shrink: 0;
  }
  .icon-btn:hover {
    color: var(--primary);
    border-color: var(--primary);
    transform: translateY(-1px);
  }
  .icon-btn:active { transform: scale(.94); }

  /* ========== Hero ========== */
  .hero { padding: 44px 0 8px; }

  .hero h1 {
    font-size: clamp(1.6rem, 5vw, 2.3rem);
    line-height: 1.3;
    margin: 0 0 12px;
    letter-spacing: -.5px;
    font-weight: 800;
  }
  .grad-text {
    background: linear-gradient(120deg, var(--primary), var(--primary-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    margin: 0 0 26px;
    color: var(--text-dim);
    font-size: .98rem;
  }

  /* 打字机 */
  .typing-effect {
    border-left: 3px solid var(--primary);
    padding: 4px 0 4px 1rem;
    margin: 0 0 32px;
    white-space: pre-wrap;
    text-align: left;
    font-size: .92rem;
    color: var(--text-dim);
    min-height: 3.6em;
    border-radius: 2px;
  }
  .caret {
    display: inline-block;
    width: 2px;
    height: 1.05em;
    background: var(--primary);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }

  /* ========== 工具栏 ========== */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin: 0 0 20px;
  }

  .search-wrap {
    position: relative;
    flex: 1 1 240px;
    display: flex;
    align-items: center;
  }
  .search-wrap .search-icon {
    position: absolute;
    left: 13px;
    color: var(--text-dim);
    pointer-events: none;
    display: flex;
  }
  .search-wrap input {
    width: 100%;
    padding: 11px 78px 11px 40px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-elev);
    color: var(--text);
    font-size: .92rem;
    font-family: inherit;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .search-wrap input::placeholder { color: var(--text-dim); }
  .search-wrap input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent);
  }
  .search-wrap kbd {
    position: absolute;
    right: 12px;
    font-size: .7rem;
    font-family: inherit;
    color: var(--text-dim);
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 6px;
    pointer-events: none;
  }
  .clear-btn {
    position: absolute;
    right: 8px;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    border: none;
    border-radius: 6px;
    background: var(--bg-elev-2);
    color: var(--text-dim);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    transition: color .2s, background .2s;
  }
  .clear-btn:hover { color: var(--text); background: var(--border); }

  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    max-width: 100%;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 15px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg-elev);
    color: var(--text-dim);
    font-size: .88rem;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: all .22s ease;
  }
  .tab:hover { color: var(--text); border-color: var(--text-dim); }
  .tab.active {
    color: #fff;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    border-color: transparent;
    box-shadow: 0 4px 16px -6px var(--primary);
  }
  .tab .count {
    font-size: .72rem;
    opacity: .75;
    background: color-mix(in srgb, currentColor 16%, transparent);
    padding: 0 6px;
    border-radius: 20px;
    min-width: 18px;
    text-align: center;
  }

  /* ========== 资源卡片网格 ========== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
    gap: 12px;
    margin-bottom: 8px;
  }

  .card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 15px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    transition: transform .28s cubic-bezier(.2,.8,.2,1),
                border-color .28s ease,
                box-shadow .28s ease,
                background .28s ease;
    animation: cardIn .4s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, color-mix(in srgb, var(--primary) 10%, transparent) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform .6s ease;
    pointer-events: none;
  }
  .card:hover::before { transform: translateX(100%); }

  .card:hover {
    transform: translateY(-4px);
    border-color: var(--primary);
    box-shadow: 0 14px 32px -14px var(--shadow), 0 0 0 1px color-mix(in srgb, var(--primary) 28%, transparent);
  }
  .card:active { transform: translateY(-1px) scale(.995); }

  .card-icon {
    flex-shrink: 0;
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem;
    border-radius: 11px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    transition: transform .28s ease, background .28s ease;
  }
  .card:hover .card-icon {
    transform: scale(1.08) rotate(-4deg);
    background: color-mix(in srgb, var(--primary) 14%, var(--bg-elev-2));
  }

  .card-body { min-width: 0; flex: 1; }
  .card-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: .95rem;
    font-weight: 600;
    margin: 0 0 2px;
    line-height: 1.35;
  }
  .card-desc {
    margin: 0;
    font-size: .8rem;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hot {
    font-size: .68rem;
    font-weight: 500;
    color: #f0883e;
    background: rgba(240, 136, 62, .13);
    border-radius: 20px;
    padding: 0 6px;
    line-height: 1.6;
    flex-shrink: 0;
  }
  .ext-mark {
    font-size: .68rem;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0 4px;
    flex-shrink: 0;
  }

  .copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 26px; height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    color: var(--text-dim);
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    opacity: 0;
    transform: translateY(-4px);
    cursor: pointer;
    transition: opacity .22s, transform .22s, color .22s, border-color .22s;
  }
  .card:hover .copy-btn,
  .copy-btn:focus-visible { opacity: 1; transform: translateY(0); }
  .copy-btn:hover { color: var(--primary); border-color: var(--primary); }

  /* 空状态 */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    margin-bottom: 8px;
  }
  .empty .empty-icon { font-size: 2.2rem; display: block; margin-bottom: 10px; opacity: .6; }

  /* ========== 视频区 ========== */
  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.1rem;
    font-weight: 700;
    margin: 44px 0 16px;
    scroll-margin-top: 84px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }

  .video-container {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    background: #000;
    box-shadow: 0 18px 40px -22px var(--shadow);
  }
  .video-container iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* ========== 页脚 ========== */
  footer {
    margin-top: 56px;
    padding: 24px 0 8px;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: .84rem;
    text-align: center;
  }
  footer .footer-links {
    display: flex;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  footer a { color: var(--text-dim); text-decoration: none; transition: color .2s; }
  footer a:hover { color: var(--primary); }

  /* ========== 返回顶部 ========== */
  .to-top {
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-elev);
    color: var(--text);
    cursor: pointer;
    box-shadow: 0 8px 24px -10px var(--shadow);
    z-index: 60;
    transition: opacity .3s, transform .3s, color .2s, border-color .2s;
  }
  .to-top:hover { color: var(--primary); border-color: var(--primary); transform: translateY(-3px); }
  .to-top.hide { opacity: 0; transform: translateY(14px) scale(.9); pointer-events: none; }

  /* ========== Toast ========== */
  .toast-wrap {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%);
    z-index: 200;
    pointer-events: none;
  }
  .toast {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 10px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: .88rem;
    box-shadow: 0 14px 34px -14px var(--shadow);
    animation: toastIn .3s cubic-bezier(.2,.8,.2,1) both;
    white-space: nowrap;
  }
  .toast.ok  { border-color: color-mix(in srgb, #3fb950 60%, var(--border)); }
  .toast.err { border-color: color-mix(in srgb, #f85149 60%, var(--border)); }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(12px) scale(.95); }
    to   { opacity: 1; transform: none; }
  }

  /* ========== 响应式 ========== */
  @media (max-width: 640px) {
    .container { padding: 0 16px 16px; }
    .site-header { margin: 0 -16px; padding: 10px 16px; }
    .header-nav { display: none; }
    .hero { padding: 30px 0 4px; }
    .grid { grid-template-columns: 1fr; }
    .toolbar { gap: 10px; }
    .search-wrap { flex-basis: 100%; }
    .copy-btn { opacity: 1; transform: none; }
    .to-top { right: 16px; bottom: 16px; }
    .toast-wrap { bottom: 20px; width: calc(100% - 32px); }
    .toast { justify-content: center; white-space: normal; text-align: center; }
  }

  /* ========== 无障碍：减少动效 ========== */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }

  /* ========== 焦点可见 ========== */
  a:focus-visible,
  button:focus-visible,
  input:focus-visible,
  .copy-btn:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }
</style>
</head>

<body>
<div id="app" v-cloak>

  <!-- 滚动进度条 -->
  <div class="progress" :style="{ transform: `scaleX(${progress / 100})` }"></div>

  <div class="container">

    <!-- 顶栏 -->
    <header class="site-header" :class="{ scrolled: scrolled }">
      <a href="#" class="logo" @click.prevent="toTop">
        <span class="logo-dot"></span>
        资源分享站
      </a>
      <nav class="header-nav">
        <a href="#resources">资源</a>
        <a href="#video">视频</a>
      </nav>
      <button class="icon-btn"
              @click="toggleTheme"
              :title="theme === 'dark' ? '切换到浅色模式' : '切换到深色模式'"
              :aria-label="theme === 'dark' ? '切换到浅色模式' : '切换到深色模式'">
        <svg v-if="theme === 'dark'" width="17" height="17" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>
        </svg>
        <svg v-else width="17" height="17" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
    </header>

    <!-- Hero -->
    <section class="hero">
      <h1>欢迎来到 <span class="grad-text">资源分享站</span></h1>
      <p class="subtitle">学习资源 · 高效分享 · 安全下载</p>

      <div class="typing-effect">
        <span>{{ typed }}</span><span class="caret" aria-hidden="true"></span>
      </div>
    </section>

    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
          </svg>
        </span>
        <input ref="searchInput"
               v-model="keyword"
               type="search"
               placeholder="搜索资源名称或描述…"
               aria-label="搜索资源">
        <kbd v-if="!keyword">Ctrl K</kbd>
        <button v-else class="clear-btn" @click="keyword = ''" title="清空" aria-label="清空搜索">×</button>
      </div>

      <div class="tabs" role="tablist">
        <button v-for="c in cats"
                :key="c.key"
                class="tab"
                :class="{ active: cat === c.key }"
                role="tab"
                :aria-selected="cat === c.key"
                @click="cat = c.key">
          {{ c.label }}
          <span class="count">{{ countOf(c.key) }}</span>
        </button>
      </div>
    </div>

    <!-- 资源网格 -->
    <section id="resources">
      <div class="grid" v-if="filtered.length">
        <a v-for="(r, i) in filtered"
           :key="r.id"
           class="card"
           :href="r.url"
           :target="r.external ? '_blank' : null"
           rel="noopener noreferrer"
           :style="{ animationDelay: Math.min(i * 45, 350) + 'ms' }"
           @click="onOpen(r)">

          <div class="card-icon" aria-hidden="true">{{ r.icon }}</div>

          <div class="card-body">
            <h3 class="card-title">
              <span>{{ r.title }}</span>
              <span v-if="hits[r.id]" class="hot" :title="`访问 ${hits[r.id]} 次`">🔥 {{ hits[r.id] }}</span>
              <span v-if="r.external" class="ext-mark">外部</span>
            </h3>
            <p class="card-desc">{{ r.desc }}</p>
          </div>

          <span class="copy-btn"
                role="button"
                tabindex="0"
                title="复制链接"
                aria-label="复制链接"
                @click.prevent.stop="copy(absolute(r.url))"
                @keydown.enter.prevent.stop="copy(absolute(r.url))"
                @keydown.space.prevent.stop="copy(absolute(r.url))">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9"
